<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Booster</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05061a;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #controls {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1;
        display: flex;
        gap: 6px;
      }
      #controls button,
      #controls select {
        font-size: 16px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 4px 10px;
      }
      /* Button states, shared by the top bar and the panels */
      #controls :is(button, select),
      .panel button {
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      #controls :is(button, select):hover:not(:disabled, .ok, .failed),
      .panel button:hover:not(:disabled, .ok, .failed) {
        background: rgba(255, 255, 255, 0.18);
        border-color: #ff7a1a;
      }
      #controls button:active:not(:disabled),
      .panel button:active:not(:disabled) {
        background: rgba(255, 122, 26, 0.35);
        transform: translateY(1px);
      }
      #controls :is(button, select):focus-visible,
      .panel :is(button, input):focus-visible {
        outline: 2px solid #ff7a1a;
        outline-offset: 2px;
      }
      #controls button:disabled,
      .panel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #controls button.ok,
      .panel button.ok {
        border-color: #3ccf6e;
        background: rgba(60, 207, 110, 0.2);
      }
      #controls button.failed,
      .panel button.failed {
        border-color: #e0312b;
        background: rgba(224, 49, 43, 0.25);
      }
      #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        max-width: min(60vw, 520px);
        background: rgba(0, 0, 0, 0.5);
        color: #dde3f0;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
        user-select: text;
        overflow-wrap: anywhere;
      }
      .panel {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(560px, calc(100vw - 32px));
        height: fit-content;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 20px;
        background: rgba(10, 14, 30, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: #fff3dc;
        text-align: center;
      }
      .panel[hidden] {
        display: none;
      }
      .panel h1 {
        margin: 0 0 14px;
        font: 700 28px Futura, 'Avenir Next', 'Century Gothic', system-ui, sans-serif;
        letter-spacing: 6px;
        color: #ff7a1a;
      }
      .panel button,
      .panel input {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 6px 12px;
      }
      .panel label {
        display: block;
        margin-bottom: 16px;
      }
      .panel input {
        margin-left: 6px;
        width: 12em;
      }
      .menu-modes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .menu-modes[hidden] {
        display: none;
      }
      .menu-modes button {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: left;
        cursor: pointer;
      }
      .menu-modes canvas {
        display: block;
        flex: none;
        width: 100%;
        height: auto;
        aspect-ratio: 220 / 96;
        border-radius: 4px;
      }
      .menu-modes strong {
        font-size: 18px;
        letter-spacing: 2px;
      }
      .menu-modes span {
        font-size: 13px;
        opacity: 0.8;
      }
      .menu-join,
      .lobby-start {
        font-size: 18px;
        padding: 10px 20px;
        border-color: #ff7a1a;
      }
      .lobby-teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 14px 0;
        text-align: left;
      }
      .lobby-teams section {
        border-top: 3px solid var(--team);
        padding-top: 6px;
      }
      .lobby-teams h3 {
        margin: 0 0 6px;
        color: var(--team);
        font-size: 14px;
        letter-spacing: 2px;
      }
      .lobby-teams ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .lobby-teams li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        padding: 4px 0;
        overflow-wrap: anywhere;
      }
      .lobby-teams li button {
        padding: 2px 10px;
      }
      .lobby-room {
        opacity: 0.8;
      }
      #tuning {
        position: fixed;
        top: 48px;
        right: 8px;
        max-height: calc(100dvh - 64px);
        overflow-y: auto;
        background: rgba(10, 14, 30, 0.9);
        color: #dde3f0;
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
      }
      #tuning fieldset {
        border: 1px solid rgba(255, 255, 255, 0.15);
        margin: 0 0 8px;
      }
      #tuning label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 3px 0;
      }
      #tuning input[type='number'] {
        width: 70px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="controls">
      <select id="map" aria-label="Map" hidden></select>
      <button id="invite" aria-live="polite" hidden>Invite</button>
      <button id="leave" aria-live="polite" hidden>Leave</button>
      <button id="tune-toggle" aria-label="Tuning panel">⚙</button>
    </div>
    <div id="menu" class="panel" hidden>
      <h1>BOOSTER</h1>
      <label>Your name <input id="player-name" maxlength="16" autocomplete="nickname" placeholder="Pilot" /></label>
      <div class="menu-modes">
        <button data-mode="pve">
          <canvas></canvas>
          <strong>PvE</strong>
          <span class="menu-pve-rules"></span>
        </button>
        <button data-mode="pvp">
          <canvas></canvas>
          <strong>PvP</strong>
          <span>Capture the flag, team vs team, up to 4 v 4. Turrets guard each base. Invite friends to a lobby.</span>
        </button>
      </div>
      <button class="menu-join" hidden></button>
    </div>
    <div id="lobby" class="panel" hidden>
      <h1>LOBBY</h1>
      <p class="lobby-room"></p>
      <button class="lobby-invite" aria-live="polite">Copy invite link</button>
      <div class="lobby-teams"></div>
      <p class="lobby-wait">Waiting for the host to start…</p>
      <button class="lobby-start">Start match</button>
    </div>
    <div id="status" hidden></div>
    <div id="tuning" hidden></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
